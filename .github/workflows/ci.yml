name: CI / Release

# Single pipeline modelled on the guardian-seal CI/Release workflow, adapted to this repo:
#   * CI gates (lint/typecheck/test, compose config, Soroban contract) run on every PR and push.
#   * Release (build + push images to DOCKER HUB) runs only once code has landed on main / a tag.
#     Images: ${DOCKERHUB_USERNAME}/payorder-api and ${DOCKERHUB_USERNAME}/payorder-web,
#     tagged sha-<short> + latest — the same scheme the guardian-seal stack already uses on
#     this VPS. Requires repo secrets DOCKERHUB_USERNAME + DOCKERHUB_TOKEN (a Docker Hub
#     access token with Read/Write scope).
#   * Deploy pushes the freshly built images to the VPS on a push to main.
#
# PRs never build/push/deploy: fork PRs don't get repo secrets, and deploying unmerged code is
# unsafe. The release + deploy jobs are therefore gated on `github.event_name == 'push'`.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ci-release-${{ github.ref }}
  # Cancel superseded runs on PRs (fast feedback), but never cancel a release/deploy on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # CI — lint · typecheck · test (workspaces)
  # ---------------------------------------------------------------------------
  build:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Cross-package consumers resolve workspace deps via their built `dist` (package.json
      # `main`/`types` point there). `@payorder/shared` is consumed by every package, and
      # `@payorder/api` is consumed by `@payorder/worker`, so both must be built before the
      # typecheck/test steps can resolve them.
      - name: Build shared packages
        run: |
          npm run build --workspace @payorder/shared
          npm run build --workspace @payorder/api

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  # ---------------------------------------------------------------------------
  # CI — Docker Compose config validation
  # ---------------------------------------------------------------------------
  compose:
    name: Docker Compose · config validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The compose files must parse with the committed example envs so a broken local/VPS
      # stack is caught on PRs, not at deploy time. `config -q` interpolates + validates only;
      # it neither builds images nor contacts the daemon for resources.
      - name: Validate local compose
        run: |
          cp infra/docker/.env.local.example infra/docker/.env.local
          docker compose --env-file infra/docker/.env.local \
            -f infra/docker/docker-compose.payorder.local.yml config -q
          echo "local compose OK"

      - name: Validate VPS compose
        run: |
          # Services declare `env_file: [.env.vps]`; `config` requires that file to exist on
          # disk (separate from the `--env-file` interpolation source), so materialize it.
          cp infra/docker/.env.payorder.vps.example infra/docker/.env.vps
          docker compose -p payorder -f infra/docker/docker-compose.payorder.vps.yml \
            --env-file infra/docker/.env.vps config -q
          echo "vps compose OK"

  # ---------------------------------------------------------------------------
  # CI — Soroban contract · fmt · clippy · test
  # ---------------------------------------------------------------------------
  contract:
    name: Soroban contract · fmt · clippy · test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/payorder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32v1-none

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/payorder/target
          key: cargo-${{ runner.os }}-${{ hashFiles('contracts/payorder/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build WASM
        run: cargo build --target wasm32v1-none --release

  # ---------------------------------------------------------------------------
  # Release — build & push images to Docker Hub (only after every CI gate passes)
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build & push ${{ matrix.image }}
    needs: [build, compose, contract]
    # Only on a real push to main or a version tag — never on PRs.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: payorder-api
            dockerfile: infra/docker/api.Dockerfile
            build_args: ''
          # The web bundle bakes NEXT_PUBLIC_* URLs at BUILD time, so they come from repo vars.
          - image: payorder-web
            dockerfile: infra/docker/web.Dockerfile
            build_args: |
              NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
              NEXT_PUBLIC_HORIZON_URL=${{ vars.NEXT_PUBLIC_HORIZON_URL }}
              NEXT_PUBLIC_SOROBAN_RPC_URL=${{ vars.NEXT_PUBLIC_SOROBAN_RPC_URL }}
              NEXT_PUBLIC_EXPLORER_BASE_URL=${{ vars.NEXT_PUBLIC_EXPLORER_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Docker Hub namespace is not secret (it's visible in every image ref), so prefer
      # the repo VARIABLE — falling back to the secret keeps single-secret setups working,
      # at the cost of `***` masking in the run logs.
      - name: Resolve Docker Hub namespace
        id: owner
        env:
          DOCKERHUB_NS: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
        run: |
          : "${DOCKERHUB_NS:?set the DOCKERHUB_USERNAME repo variable (or secret)}"
          echo "value=${DOCKERHUB_NS}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.owner.outputs.value }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # ---------------------------------------------------------------------------
  # Deploy — push the freshly built "latest" images to the VPS on a push to main
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to VPS
    needs: build-and-push
    # Deploys on every push to the default branch (PRs/tags never deploy). Requires the
    # VPS_* / app secrets below to be configured.
    #
    # The VPS needs NO git checkout: this job copies just the two config files it needs
    # (the compose file + the Traefik route toml) over SSH, renders .env.vps beside them,
    # and pulls the images from Docker Hub. VPS_PATH is a plain directory, created on demand.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: vps # add required reviewers here for a manual approval gate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: echo "image_tag=sha-$(echo "${GITHUB_SHA}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      # Percent-encode the DB password for use inside DATABASE_URL. A raw password from e.g.
      # `openssl rand -base64` can contain URL-special chars (/, +, =) that make postgres-js's
      # `new URL(...)` throw "Invalid URL". porsager/postgres decodes the userinfo back at
      # connect time, so the encoded form still authenticates against the raw DB password.
      - name: URL-encode the DB password
        id: pgpass
        env:
          RAW: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          ENC=$(python3 -c "import os,urllib.parse; print(urllib.parse.quote(os.environ['RAW'], safe=''))")
          echo "::add-mask::${ENC}"
          echo "enc=${ENC}" >> "$GITHUB_OUTPUT"

      # Copy ONLY the compose file + the Traefik route toml to the VPS (flattened into
      # VPS_PATH). strip_components drops the infra/docker & infra/traefik prefixes so both
      # land directly in VPS_PATH; the SSH step below renders .env.vps beside them.
      - name: Copy compose + Traefik route to the VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'infra/docker/docker-compose.payorder.vps.yml,infra/traefik/payorder_dynamic.toml'
          target: ${{ secrets.VPS_PATH }}
          strip_components: 2

      - name: Deploy over SSH (render .env.vps → sync route → pull → migrate → up → smoke)
        uses: appleboy/ssh-action@v1
        env:
          # Image tag CI just built + pushed.
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
          VPS_PATH: ${{ secrets.VPS_PATH }}

          # --- Non-secret config (repo Variables; shell defaults below cover unset ones) ---
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          WEB_DOMAIN: ${{ vars.WEB_DOMAIN }}
          API_DOMAIN: ${{ vars.API_DOMAIN }}
          TRAEFIK_NETWORK: ${{ vars.TRAEFIK_NETWORK }}
          # Directory watched by the existing (file-provider) Traefik. Override with the repo
          # variable TRAEFIK_DYNAMIC_DIR if yours differs.
          TRAEFIK_DYNAMIC_DIR: ${{ vars.TRAEFIK_DYNAMIC_DIR }}
          # Public on-chain (Testnet) contract address — env-specific. Accept it from a repo
          # VARIABLE or a SECRET (same fallback as DOCKERHUB_USERNAME) so it resolves whichever
          # tab it was created under.
          SOROBAN_CONTRACT_ID: ${{ vars.SOROBAN_CONTRACT_ID || secrets.SOROBAN_CONTRACT_ID }}

          # --- Secrets (repo Secrets; never printed, never committed) ---
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_PASSWORD_ENCODED: ${{ steps.pgpass.outputs.enc }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          WEBHOOK_SIGNING_SECRET: ${{ secrets.WEBHOOK_SIGNING_SECRET }}
          SOROBAN_ADMIN_SECRET: ${{ secrets.SOROBAN_ADMIN_SECRET }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # appleboy/ssh-action only forwards the env vars named here into the remote shell.
          envs: IMAGE_TAG,VPS_PATH,DOCKERHUB_USERNAME,WEB_DOMAIN,API_DOMAIN,TRAEFIK_NETWORK,TRAEFIK_DYNAMIC_DIR,SOROBAN_CONTRACT_ID,POSTGRES_PASSWORD,POSTGRES_PASSWORD_ENCODED,JWT_SECRET,WEBHOOK_SIGNING_SECRET,SOROBAN_ADMIN_SECRET
          script: |
            set -euo pipefail
            cd "${VPS_PATH:?VPS_PATH not set}"

            # --- Fail fast if a required secret was not configured in GitHub ---
            : "${DOCKERHUB_USERNAME:?set the DOCKERHUB_USERNAME repo variable (or secret)}"
            : "${POSTGRES_PASSWORD:?set the POSTGRES_PASSWORD repo secret}"
            : "${JWT_SECRET:?set the JWT_SECRET repo secret}"
            : "${WEBHOOK_SIGNING_SECRET:?set the WEBHOOK_SIGNING_SECRET repo secret}"
            : "${SOROBAN_ADMIN_SECRET:?set the SOROBAN_ADMIN_SECRET repo secret}"
            : "${SOROBAN_CONTRACT_ID:?set the SOROBAN_CONTRACT_ID repo variable or secret}"

            # --- Non-secret config: repo Variables override these production defaults ---
            WEB_DOMAIN="${WEB_DOMAIN:-pow3.guardian-labs.xyz}"
            API_DOMAIN="${API_DOMAIN:-pow3-api.guardian-labs.xyz}"
            TRAEFIK_NETWORK="${TRAEFIK_NETWORK:-proxy}"
            TRAEFIK_DYNAMIC_DIR="${TRAEFIK_DYNAMIC_DIR:-${HOME}/DockerConfig/traefik/dynamic}"
            POSTGRES_USER=payorder
            POSTGRES_DB=payorder
            COMPOSE_FILE=docker-compose.payorder.vps.yml

            # --- Render .env.vps (env_file + Compose interpolation source), beside the compose ---
            # umask so the file is created 0600; regenerated on every deploy from GitHub state,
            # and wiped on exit (trap below) so secrets never linger on the VPS disk.
            echo "==> Rendering ${VPS_PATH}/.env.vps (IMAGE_TAG=${IMAGE_TAG})"
            umask 077
            cat > .env.vps <<EOF
            # Generated by CI (.github/workflows/ci.yml) — do NOT edit by hand; changes are
            # overwritten on the next deploy. Sourced from GitHub Secrets + Variables.
            DOCKERHUB_USERNAME=${DOCKERHUB_USERNAME}
            IMAGE_TAG_API=${IMAGE_TAG}
            IMAGE_TAG_WEB=${IMAGE_TAG}

            TRAEFIK_NETWORK=${TRAEFIK_NETWORK}
            WEB_DOMAIN=${WEB_DOMAIN}
            API_DOMAIN=${API_DOMAIN}

            POSTGRES_USER=${POSTGRES_USER}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            POSTGRES_DB=${POSTGRES_DB}

            NODE_ENV=production
            API_PORT=3000
            LOG_LEVEL=info
            DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD_ENCODED}@payorder_postgres:5432/${POSTGRES_DB}
            REDIS_URL=redis://payorder_redis:6379

            APP_BASE_URL=https://${API_DOMAIN}
            PUBLIC_WEB_URL=https://${WEB_DOMAIN}
            JWT_SECRET=${JWT_SECRET}
            WEBHOOK_SIGNING_SECRET=${WEBHOOK_SIGNING_SECRET}
            CORS_ORIGINS=https://${WEB_DOMAIN}

            STELLAR_NETWORK=TESTNET
            STELLAR_NETWORK_PASSPHRASE=Test SDF Network ; September 2015
            STELLAR_HORIZON_URL=https://horizon-testnet.stellar.org
            STELLAR_SOROBAN_RPC_URL=https://soroban-testnet.stellar.org
            STELLAR_FRIENDBOT_URL=https://friendbot.stellar.org
            SOROBAN_CONTRACT_ID=${SOROBAN_CONTRACT_ID}
            SOROBAN_ADMIN_SECRET=${SOROBAN_ADMIN_SECRET}
            REGISTER_ON_CHAIN_SYNC=false

            NEXT_PUBLIC_API_BASE_URL=https://${API_DOMAIN}
            NEXT_PUBLIC_HORIZON_URL=https://horizon-testnet.stellar.org
            NEXT_PUBLIC_SOROBAN_RPC_URL=https://soroban-testnet.stellar.org
            NEXT_PUBLIC_EXPLORER_BASE_URL=https://stellar.expert/explorer/testnet
            API_INTERNAL_BASE_URL=http://payorder_api:3000
            EOF
            chmod 600 .env.vps
            # Wipe the rendered secrets on ANY exit (success or failure); the running containers
            # keep their env from `compose up`, and the next deploy re-renders the file.
            trap 'rm -f .env.vps' EXIT

            COMPOSE=(docker compose -p payorder -f "${COMPOSE_FILE}" --env-file .env.vps)

            # --- Sync the Traefik route (file-provider Traefik hot-reloads; no restart) ---
            if [[ -d "${TRAEFIK_DYNAMIC_DIR}" ]]; then
              echo "==> Syncing payorder_dynamic.toml -> ${TRAEFIK_DYNAMIC_DIR}/"
              cp payorder_dynamic.toml "${TRAEFIK_DYNAMIC_DIR}/"
            else
              echo "==> Traefik dynamic dir not found (${TRAEFIK_DYNAMIC_DIR}) — skipping route sync" >&2
            fi

            echo "==> Validating compose configuration"
            "${COMPOSE[@]}" config -q

            echo "==> Pulling images from Docker Hub"
            "${COMPOSE[@]}" pull

            echo "==> Applying database migrations (one-shot)"
            "${COMPOSE[@]}" run --rm migrate

            echo "==> Starting / updating services"
            "${COMPOSE[@]}" up -d --remove-orphans
            "${COMPOSE[@]}" ps

            # --- Smoke test: wait for the API to report healthy ---
            SMOKE_URL="https://${API_DOMAIN}"
            echo "==> Smoke test against ${SMOKE_URL} (/health, /ready)"
            for attempt in $(seq 1 30); do
              if curl -fsS --max-time 5 "${SMOKE_URL}/health" >/dev/null 2>&1; then
                echo "/health OK (attempt ${attempt})"
                curl -fsS --max-time 5 "${SMOKE_URL}/ready" >/dev/null 2>&1 \
                  && echo "/ready OK" || { echo "ERROR: /ready not green — check 'docker compose -p payorder logs api'" >&2; exit 1; }
                echo "✅ Deploy successful."
                exit 0
              fi
              sleep 5
            done
            echo "ERROR: ${SMOKE_URL}/health did not become healthy in time" >&2
            exit 1
