# =============================================================================
# PayOrder W3 Guardian — Production stack on the VPS (Stellar TESTNET).
#
# Runs SIDE BY SIDE with the guardian-seal stacks on the SAME VPS, behind the
# EXISTING Traefik (singleton owned by the other product). That Traefik has the
# **Docker provider DISABLED** (incompatible with Docker Engine 29.x) and routes
# only via the **file/directory provider** (`--providers.file.directory=/dynamic`),
# so `traefik.*` labels would be silently ignored — this compose uses none.
#
# How this stack plugs into the existing Traefik (same model as guardian-seal):
#   • It does NOT run Traefik/Portainer — those are singletons already owned by
#     the other product. This stack only JOINS the external `proxy` network and
#     the running Traefik routes to it by CONTAINER NAME (payorder_api /
#     payorder_web), per infra/traefik/payorder_dynamic.toml.
#   • Public services (api/web) live on `proxy`; postgres/redis/worker/migrate
#     stay on a private `internal` network, never reachable from Traefik/host.
#   • Isolated project name (`payorder`) + `payorder_*` container/volume names →
#     no collision with the other product's containers or volumes.
#   • Images are pulled from DOCKER HUB, published by the release job in
#     .github/workflows/ci.yml: ${DOCKERHUB_USERNAME}/payorder-api and
#     ${DOCKERHUB_USERNAME}/payorder-web, tagged sha-<short> and latest.
#   • Persistence uses NAMED DOCKER VOLUMES (payorder_pg / payorder_redis), not
#     bind mounts — managed by Docker under /var/lib/docker/volumes.
#   • Stellar is the public **Testnet** (mainnet is rejected by app config).
#
# DNS isolation on the shared `proxy` network:
#   Compose adds each service name as a network alias, so a bare `api`/`web`
#   alias could collide with the other product's `api`/`web` on `proxy`. We
#   therefore reference peers by their UNIQUE container names (payorder_*):
#   DATABASE_URL/REDIS_URL and the web→api SSR URL all use `payorder_*` hosts,
#   which Docker's embedded DNS resolves unambiguously.
#
# Environment (in ./.env.vps on the VPS — rendered by CI on each deploy):
#   DOCKERHUB_USERNAME   Docker Hub user/namespace (required)
#   IMAGE_TAG_API        api/worker/migrate image tag (optional; default latest)
#   IMAGE_TAG_WEB        web image tag              (optional; default latest)
#   TRAEFIK_NETWORK      shared ingress network      (optional; default proxy)
#   POSTGRES_*, JWT_SECRET, ... (see .env.payorder.vps.example)
#
# Prerequisites on the VPS (once):
#   docker network ls | grep -w proxy          # confirm the shared network exists
#   cp infra/traefik/payorder_dynamic.toml ~/DockerConfig/traefik/dynamic/
#   # (Traefik with --providers.file.watch=true hot-reloads it — no restart.)
#   cp infra/docker/.env.payorder.vps.example infra/docker/.env.vps  # then fill in
#
# Validate / deploy (or just run infra/scripts/deploy.sh):
#   docker compose -p payorder -f infra/docker/docker-compose.payorder.vps.yml --env-file infra/docker/.env.vps config
#   docker compose -p payorder -f infra/docker/docker-compose.payorder.vps.yml pull
#   docker compose -p payorder -f infra/docker/docker-compose.payorder.vps.yml run --rm migrate
#   docker compose -p payorder -f infra/docker/docker-compose.payorder.vps.yml up -d
# =============================================================================
name: payorder

services:
  api:
    image: ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME nao definido}/payorder-api:${IMAGE_TAG_API:-latest}
    container_name: payorder_api
    env_file: ['.env.vps']
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    networks: [proxy, internal] # proxy → Traefik routes here; internal → db/redis
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: &default-logging
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  worker:
    image: ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME nao definido}/payorder-api:${IMAGE_TAG_API:-latest}
    container_name: payorder_worker
    command: ['node', 'apps/worker/dist/index.js']
    env_file: ['.env.vps']
    restart: unless-stopped
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    networks: [internal] # no Traefik; never exposed
    logging: *default-logging

  web:
    image: ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME nao definido}/payorder-web:${IMAGE_TAG_WEB:-latest}
    container_name: payorder_web
    env_file: ['.env.vps']
    restart: unless-stopped
    # SSR reaches the API by its UNIQUE container name (a bare `api` alias would
    # be ambiguous on the shared `proxy` network). Overrides any value in .env.
    environment:
      API_INTERNAL_BASE_URL: ${API_INTERNAL_BASE_URL:-http://payorder_api:3000}
    depends_on:
      api: { condition: service_started }
    networks: [proxy]
    logging: *default-logging

  postgres:
    image: postgres:16-alpine
    container_name: payorder_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: ['payorder_pg:/var/lib/postgresql/data'] # named docker volume
    restart: unless-stopped
    networks: [internal] # never exposed to Traefik/host
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: payorder_redis
    command: ['redis-server', '--appendonly', 'yes']
    volumes: ['payorder_redis:/data'] # named docker volume
    restart: unless-stopped
    networks: [internal]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  # One-shot: apply migrations before api/worker start. Run explicitly or via depends_on.
  migrate:
    image: ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME nao definido}/payorder-api:${IMAGE_TAG_API:-latest}
    container_name: payorder_migrate
    command: ['node', 'apps/api/dist/infrastructure/persistence/migrate.js']
    env_file: ['.env.vps']
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]
    restart: 'no'
    logging: *default-logging

  # One-shot: create the FIRST admin panel account from SEED_ADMIN_EMAIL / SEED_ADMIN_PASSWORD
  # (idempotent; creates NO demo tenant). Not in any `depends_on` — the deploy runs it explicitly
  # after migrate. The credentials are passed at run time (CI: `run --rm -e SEED_ADMIN_EMAIL
  # -e SEED_ADMIN_PASSWORD bootstrap-admin`) so the panel password is not baked into .env.vps.
  # With neither var set the entrypoint just skips, so the service is always safe to run.
  bootstrap-admin:
    image: ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME nao definido}/payorder-api:${IMAGE_TAG_API:-latest}
    container_name: payorder_bootstrap_admin
    command: ['node', 'apps/api/dist/infrastructure/persistence/bootstrap-admin.js']
    env_file: ['.env.vps']
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    networks: [internal]
    restart: 'no'
    logging: *default-logging

volumes:
  payorder_pg:
  payorder_redis:

networks:
  # Existing Traefik ingress network (created by the other product's stack).
  # Defaults to `proxy` (the real network name on the VPS); override with
  # TRAEFIK_NETWORK if yours differs (`docker network ls` to confirm).
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-proxy}
  # Private network for db/redis/worker ↔ api; scoped to project `payorder`,
  # so its `postgres`/`redis` aliases never collide with the other product.
  internal:
    driver: bridge
